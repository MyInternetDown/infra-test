name: Production Progressive Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: "Kubernetes Deployment name"
        required: true
        default: "api"
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: "app"
      container:
        description: "Container name to update"
        required: true
        default: "api"
      image:
        description: "Full image URI and tag to deploy"
        required: true
      regions:
        description: "Comma-separated production regions"
        required: true
        default: "ca-central-1,us-east-1,eu-west-1"
      steps:
        description: "Comma-separated canary percentages"
        required: true
        default: "5,10,25,50,100"

permissions:
  contents: read
  id-token: write

jobs:
  resolve-inputs:
    name: resolve deployment inputs
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.resolve.outputs.app }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      container: ${{ steps.resolve.outputs.container }}
      image: ${{ steps.resolve.outputs.image }}
      regions: ${{ steps.resolve.outputs.regions }}
      steps: ${{ steps.resolve.outputs.steps }}
    steps:
      - id: resolve
        run: |
          app="${{ github.event_name == 'workflow_dispatch' && inputs.app || vars.PROD_DEPLOY_APP }}"
          namespace="${{ github.event_name == 'workflow_dispatch' && inputs.namespace || vars.PROD_DEPLOY_NAMESPACE }}"
          container="${{ github.event_name == 'workflow_dispatch' && inputs.container || vars.PROD_DEPLOY_CONTAINER }}"
          image="${{ github.event_name == 'workflow_dispatch' && inputs.image || vars.PROD_DEPLOY_IMAGE }}"
          regions="${{ github.event_name == 'workflow_dispatch' && inputs.regions || vars.PROD_DEPLOY_REGIONS }}"
          steps="${{ github.event_name == 'workflow_dispatch' && inputs.steps || vars.PROD_DEPLOY_STEPS }}"

          if [ -z "$app" ] || [ -z "$namespace" ] || [ -z "$container" ] || [ -z "$image" ] || [ -z "$regions" ]; then
            echo "Missing production deployment configuration."
            echo "For push-to-main runs, set repository variables:"
            echo "PROD_DEPLOY_APP, PROD_DEPLOY_NAMESPACE, PROD_DEPLOY_CONTAINER, PROD_DEPLOY_IMAGE, PROD_DEPLOY_REGIONS."
            exit 1
          fi

          if [ -z "$steps" ]; then
            steps="5,10,25,50,100"
          fi

          {
            echo "app=$app"
            echo "namespace=$namespace"
            echo "container=$container"
            echo "image=$image"
            echo "regions=$regions"
            echo "steps=$steps"
          } >> "$GITHUB_OUTPUT"

  progressive-deploy:
    name: progressive deploy
    runs-on: ubuntu-latest
    needs: resolve-inputs
    # Configure the production-progressive GitHub Environment with required
    # reviewers. Add the repository owner or an owners team there; GitHub will
    # pause this job until that approval is granted.
    environment: production-progressive
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1

      - uses: azure/setup-kubectl@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Progressive regional deploy
        run: |
          scripts/prod-progressive-deploy.sh \
            --app "${{ needs.resolve-inputs.outputs.app }}" \
            --namespace "${{ needs.resolve-inputs.outputs.namespace }}" \
            --container "${{ needs.resolve-inputs.outputs.container }}" \
            --image "${{ needs.resolve-inputs.outputs.image }}" \
            --regions "${{ needs.resolve-inputs.outputs.regions }}" \
            --cluster-template 'product-platform-prod-{region}-eks' \
            --steps "${{ needs.resolve-inputs.outputs.steps }}" \
            --auto-approve-steps
