name: Terraform Promote

on:
  workflow_dispatch:
    inputs:
      prod_region:
        description: "Production region to promote after staging"
        required: true
        default: "ca-central-1"
        type: choice
        options:
          - ca-central-1
          - us-east-1
          - eu-west-1

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.0"

jobs:
  apply-dev:
    name: apply dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
      - name: Terraform init
        working-directory: infra/envs/dev/ca-central-1
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"
      - name: Terraform plan
        working-directory: infra/envs/dev/ca-central-1
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: infra/envs/dev/ca-central-1
        run: terraform apply -input=false -auto-approve tfplan

  apply-staging:
    name: apply staging
    runs-on: ubuntu-latest
    needs: apply-dev
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
      - name: Terraform init
        working-directory: infra/envs/staging/ca-central-1
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"
      - name: Terraform plan
        working-directory: infra/envs/staging/ca-central-1
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: infra/envs/staging/ca-central-1
        run: terraform apply -input=false -auto-approve tfplan

  apply-prod:
    name: apply prod
    runs-on: ubuntu-latest
    needs: apply-staging
    environment: production-${{ inputs.prod_region }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
      - name: Terraform init
        working-directory: infra/envs/prod/${{ inputs.prod_region }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"
      - name: Terraform plan
        working-directory: infra/envs/prod/${{ inputs.prod_region }}
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: infra/envs/prod/${{ inputs.prod_region }}
        run: terraform apply -input=false -auto-approve tfplan
