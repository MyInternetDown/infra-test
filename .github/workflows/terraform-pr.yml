name: Terraform PR

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.10.0"

jobs:
  fmt-validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/global/state-bootstrap
          - infra/global/dns
          - infra/global/iam
          - infra/envs/dev/ca-central-1
          - infra/envs/staging/ca-central-1
          - infra/envs/prod/ca-central-1
          - infra/envs/prod/us-east-1
          - infra/envs/prod/eu-west-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -recursive -check

      - name: Terraform init without backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ matrix.root }}
        run: terraform validate

  lint-scan:
    name: lint and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint init
        run: tflint --init

      - name: TFLint
        run: tflint --recursive

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          soft_fail: false

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: [fmt-validate, lint-scan]
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/envs/dev/ca-central-1
          - infra/envs/staging/ca-central-1
          - infra/envs/prod/ca-central-1
          - infra/envs/prod/us-east-1
          - infra/envs/prod/eu-west-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Terraform init
        working-directory: ${{ matrix.root }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Terraform plan
        working-directory: ${{ matrix.root }}
        run: terraform plan -input=false -no-color
