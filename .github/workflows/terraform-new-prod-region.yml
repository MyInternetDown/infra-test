name: Terraform New Production Region

on:
  pull_request:
    paths:
      - "infra/envs/prod/**"
      - "infra/stacks/**"
      - "infra/modules/**"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.10.0"

jobs:
  discover:
    name: discover prod roots
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@v4
      - id: roots
        run: |
          roots="$(find infra/envs/prod -mindepth 1 -maxdepth 1 -type d ! -name '_template' | sort | jq -R -s -c 'split("\n")[:-1]')"
          echo "roots=${roots}" >> "$GITHUB_OUTPUT"

  plan:
    name: plan ${{ matrix.root }}
    runs-on: ubuntu-latest
    needs: discover
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.discover.outputs.roots) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}

      - name: Terraform init
        working-directory: ${{ matrix.root }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}"

      - name: Terraform plan
        working-directory: ${{ matrix.root }}
        run: terraform plan -input=false -no-color
